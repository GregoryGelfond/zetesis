name: checks
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.97.1"
  # Fresh hosted jobs do not reuse incremental caches. Keep source/line
  # backtraces without replicating full type-level debug data into every test.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            --component rustfmt,clippy
      - name: Initial runner disk usage
        run: df -h .
      - run: ./scripts/check.sh portable
      - name: Final runner disk usage
        if: always()
        run: |
          df -h .
          du -sh target

  proofs:
    runs-on: ubuntu-latest
    env:
      LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install pinned Elan
        # lean-action v1.5.0 installs from elan/master; use the fixed official
        # release archive and its published SHA-256 instead.
        run: |
          elan_setup="$RUNNER_TEMP/elan-4.2.4"
          mkdir -p "$elan_setup"
          curl --fail --show-error --silent --location \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$elan_setup/elan.tar.gz"
          printf '%s  %s\n' \
            42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63 \
            "$elan_setup/elan.tar.gz" | sha256sum --check --strict
          tar -xzf "$elan_setup/elan.tar.gz" -C "$elan_setup"
          "$elan_setup/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install and verify the proof toolchain
        working-directory: proofs
        run: |
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          elan toolchain install "$LEAN_TOOLCHAIN"
          lean --version
          lake --version
      - name: Build the proof library, audit axioms, and verify the proof record
        # No .lake cache: the pinned kernel checks every proof on a fresh checkout.
        run: ./scripts/check.sh proofs

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The previous committed floor is checked for push and PR histories.
          fetch-depth: 0
      - run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            --component llvm-tools
      - uses: taiki-e/install-action@51c9d223e46ef0189fd65bfe00a28e0de249282c
        with:
          tool: cargo-llvm-cov@0.8.7
      - name: Preserve the committed floor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          import re
          import subprocess

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          previous = event.get("pull_request", {}).get("base", {}).get("sha") or event.get("before")
          if previous and previous != "0" * 40:
              if not re.fullmatch(r"[0-9a-f]{40}", previous):
                  raise SystemExit("Invalid previous revision for coverage floor comparison.")
              path = "scripts/coverage-floor.txt"
              old = subprocess.run(["git", "show", f"{previous}:{path}"], text=True, capture_output=True)
              if old.returncode == 0 and old.stdout.strip() != "UNMEASURED":
                  before = int(old.stdout.strip())
                  after = int(Path(path).read_text().strip())
                  if after < before:
                      raise SystemExit(f"Coverage floor cannot decrease: {before} -> {after}")
              elif old.returncode != 0:
                  # Only absence at the prior revision permits initial adoption.
                  exists = subprocess.run(["git", "ls-tree", previous, "--", path], check=True,
                                          text=True, capture_output=True)
                  if exists.stdout:
                      raise SystemExit("Could not read the previous coverage floor.")
          PY
      - name: Initial runner disk usage
        run: df -h .
      - run: ./scripts/coverage.sh gate
      - name: Final runner disk usage
        if: always()
        run: |
          df -h .
          du -sh target
      - name: Retain coverage reports and gate diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-coverage-${{ github.sha }}
          path: |
            target/coverage/status.txt
            target/coverage/toolchain.json
            target/coverage/workspace/coverage.json
            target/coverage/workspace/html/
            target/coverage/cli-cpu/coverage.json
            target/coverage/cli-cpu/html/
          if-no-files-found: warn
          retention-days: 14
