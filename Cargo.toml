[workspace]
resolver = "3"
members = ["crates/*", "crates/zetesis/tests/fixtures/consumer"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT"
version = "0.5.0"

# The enforced Rust subset of the estate baseline. Exceptions are named and argued at
# their point of use; a prototype narrows features, not these checks.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unused = { level = "deny", priority = -1 }
unused_must_use = "deny"
dead_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }

[workspace.dependencies]
zetesis-bench = { path = "crates/zetesis-bench" }
zetesis-presentation = { path = "crates/zetesis-presentation" }
zetesis-validation = { path = "crates/zetesis-validation" }
zetesis-solve = { path = "crates/zetesis-solve", default-features = false }
zetesis-engine = { path = "crates/zetesis-engine" }
zetesis-telemetry = { path = "crates/zetesis-telemetry" }
zetesis-test-support = { path = "crates/zetesis-test-support" }
zetesis-clingo-support = { path = "crates/zetesis-clingo-support" }
zetesis-reference-support = { path = "crates/zetesis-reference-support" }
zetesis-theory-support = { path = "crates/zetesis-theory-support" }
zetesis-core = { path = "crates/zetesis-core" }
zetesis-backend = { path = "crates/zetesis-backend" }
zetesis-themelios = { path = "crates/zetesis-themelios" }
zetesis-cpu = { path = "crates/zetesis-cpu" }
zetesis-wgpu = { path = "crates/zetesis-wgpu" }
zetesis-ferraris = { path = "crates/zetesis-ferraris" }
zetesis-sat = { path = "crates/zetesis-sat" }
zetesis-objective = { path = "crates/zetesis-objective" }
# Reviewed estate frontend; never builds against estate worktrees.
themelios-base = { git = "https://github.com/GregoryGelfond/themelios.git", rev = "4c163d0d07cf67180354d9b605e19df2d355529e", package = "themelios-base" }
themelios-syntax = { git = "https://github.com/GregoryGelfond/themelios.git", rev = "4c163d0d07cf67180354d9b605e19df2d355529e", package = "themelios-syntax" }
themelios-program = { git = "https://github.com/GregoryGelfond/themelios.git", rev = "4c163d0d07cf67180354d9b605e19df2d355529e", package = "themelios-program" }
themelios-analysis = { git = "https://github.com/GregoryGelfond/themelios.git", rev = "4c163d0d07cf67180354d9b605e19df2d355529e", package = "themelios-analysis", default-features = false }
themelios-solve = { git = "https://github.com/GregoryGelfond/themelios.git", rev = "4c163d0d07cf67180354d9b605e19df2d355529e" }
themelios-query = { git = "https://github.com/GregoryGelfond/themelios.git", rev = "4c163d0d07cf67180354d9b605e19df2d355529e" }
themelios-macros = { git = "https://github.com/GregoryGelfond/themelios.git", rev = "4c163d0d07cf67180354d9b605e19df2d355529e" }
rayon = "1.12"
# Retained proposal workers borrow the factory held by their owning cell.
self_cell = { version = "=1.3.0", default-features = false }
# Borrowed canonical atom queries use Equivalent rather than an owned key copy.
hashbrown = { version = "0.17.1", default-features = false }
# zetesis-wgpu adds the one graphics API each target compiles: Metal on Apple
# targets, Vulkan on all others.
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl"] }
bytemuck = "1.25"
pollster = "0.4"
clap = { version = "4.6", features = ["derive"] }
