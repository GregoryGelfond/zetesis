[package]
name = "zetesis-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Measure zetesis on its benchmark suite, beside clingo when there is one, and compare saved runs."

[dependencies]
zetesis-backend = { workspace = true, features = ["clap"] }
zetesis-presentation = { workspace = true, features = ["clap"] }
zetesis-validation.workspace = true
clap.workspace = true
serde_json = "1"

[dev-dependencies]
tempfile = "3"
zetesis-test-support.workspace = true

[[bin]]
name = "zetesis-bench"
path = "src/main.rs"

[lints]
workspace = true
