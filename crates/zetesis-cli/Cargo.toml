[package]
name = "zetesis-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
zetesis-presentation = { workspace = true, features = ["clap"] }
zetesis-backend = { workspace = true, features = ["clap"] }
zetesis-validation.workspace = true
zetesis-solve.workspace = true
zetesis-telemetry.workspace = true
rayon.workspace = true
zetesis-core.workspace = true
zetesis-themelios.workspace = true
zetesis-cpu.workspace = true
zetesis-ferraris.workspace = true
zetesis-sat.workspace = true
zetesis-objective.workspace = true
zetesis-wgpu = { workspace = true, optional = true }
clap.workspace = true
serde = "1"
serde_json = "=1.0.151"

[dev-dependencies]
tempfile = "3"
zetesis-bench.workspace = true
zetesis-test-support.workspace = true

[lints]
workspace = true

[features]
default = ["gpu"]
gpu = ["dep:zetesis-wgpu", "zetesis-solve/gpu"]

[[bin]]
name = "zetesis"
path = "src/main.rs"

[[example]]
name = "book-answer-renderer"
path = "../../docs/book/examples/answer-renderer.rs"
