[package]
name = "zetesis-experiments"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Reproducible conformance and backend measurements for zetesis."

[dependencies]
zetesis-core.workspace = true
zetesis-cpu.workspace = true
zetesis-wgpu.workspace = true
zetesis-ferraris.workspace = true
zetesis-sat.workspace = true
zetesis-objective.workspace = true
zetesis-themelios.workspace = true
themelios-base.workspace = true
clap.workspace = true
rayon.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
zetesis-validation = { path = "../zetesis-validation" }
zetesis-solve = { workspace = true, features = ["gpu"] }

[lints]
workspace = true

[[bin]]
name = "zetesis-bench"
path = "src/main.rs"

[[bench]]
name = "oracles"
harness = false

[[example]]
name = "session-projection"
test = true
