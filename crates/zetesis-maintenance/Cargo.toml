[package]
name = "zetesis-maintenance"
default-run = "zetesis-maintenance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
clap.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex = "1"

[dev-dependencies]
tempfile = "3"
zetesis-validation = { path = "../zetesis-validation" }

[lints]
workspace = true

[features]
test-fixtures = []

[[bin]]
name = "zetesis-maintenance-fixture"
path = "tests/support/fixture_main.rs"
required-features = ["test-fixtures"]
