[package]
name = "zetesis-maintenance"
version.workspace = true
description = "Repository assurance, independent of solver execution and answer semantics."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
default-run = "zetesis-maintenance"

[dependencies]
clap.workspace = true
# Named for its feature alone: syn's spans report lines and columns outside a
# procedural macro only with span-locations.
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
syn = { version = "2.0.119", features = ["full"] }
regex = "1"
zetesis-backend = { workspace = true, features = ["clap"] }
zetesis-validation.workspace = true

[dev-dependencies]
tempfile.workspace = true
zetesis-test-support.workspace = true

[lints]
workspace = true

[[bin]]
name = "zetesis-maintenance-fixture"
path = "tests/support/fixture_main.rs"
