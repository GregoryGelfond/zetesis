[package]
name = "zetesis-maintenance"
default-run = "zetesis-maintenance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
clap.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex = "1"
zetesis-backend = { workspace = true, features = ["clap"] }
zetesis-validation = { path = "../zetesis-validation" }

[dev-dependencies]
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
syn = { version = "=2.0.119", features = ["full"] }
tempfile = "3"

[lints]
workspace = true

[[bin]]
name = "zetesis-maintenance-fixture"
path = "tests/support/fixture_main.rs"
