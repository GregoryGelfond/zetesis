[package]
name = "zetesis-solve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
zetesis-telemetry.workspace = true
zetesis-backend.workspace = true
zetesis-core.workspace = true
zetesis-themelios.workspace = true
zetesis-cpu.workspace = true
zetesis-ferraris.workspace = true
zetesis-sat.workspace = true
zetesis-objective.workspace = true
zetesis-wgpu = { workspace = true, optional = true }
rayon.workspace = true

[dev-dependencies]
zetesis-validation = { path = "../zetesis-validation" }
zetesis-clingo-support.workspace = true
zetesis-reference-support.workspace = true

[lints]
workspace = true

[features]
default = ["gpu"]
gpu = ["dep:zetesis-wgpu"]

[[example]]
name = "solve"
path = "examples/solve.rs"
test = true

[[example]]
name = "book-session"
path = "../../docs/book/examples/session.rs"
test = true

[[example]]
name = "book-source"
path = "../../docs/book/examples/source.rs"

[[example]]
name = "book-selection"
path = "../../docs/book/examples/selection.rs"

[[example]]
name = "book-projected-answers"
path = "../../docs/book/examples/projected-answers.rs"

[[example]]
name = "book-observations"
path = "../../docs/book/examples/observations.rs"

[[example]]
name = "book-costs-and-output"
path = "../../docs/book/examples/costs-and-output.rs"
test = true

[[example]]
name = "book-resources"
path = "../../docs/book/examples/resources.rs"
required-features = ["gpu"]

[[example]]
name = "book-profiles"
path = "../../docs/book/examples/profiles.rs"
required-features = ["gpu"]

[[example]]
name = "book-measurements"
path = "../../docs/book/examples/measurements.rs"

[[example]]
name = "book-hybrid"
path = "../../docs/book/examples/hybrid.rs"
test = true

[[example]]
name = "book-terminal"
path = "../../docs/book/examples/terminal.rs"
test = true
