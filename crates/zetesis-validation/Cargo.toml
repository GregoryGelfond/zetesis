[package]
name = "zetesis-validation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
clap.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tempfile = "3"
zetesis-backend = { workspace = true, features = ["clap", "serde"] }
zetesis-core.workspace = true
themelios-program.workspace = true
themelios-syntax.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["resource"] }
signal-hook = { version = "=0.4.4", default-features = false }

[dev-dependencies]
proptest = "1.11"
zetesis-clingo-support.workspace = true
zetesis-test-support.workspace = true

[lints]
workspace = true

[[bin]]
name = "zetesis-validate"
path = "src/main.rs"

[[example]]
name = "book-workload"
path = "../../docs/book/examples/workload.rs"
test = true

[[example]]
name = "release_observations"
test = true

[[example]]
name = "grounding_comparison"
test = true
