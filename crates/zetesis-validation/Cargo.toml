[package]
name = "zetesis-validation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
clap.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
zetesis-core.workspace = true
themelios-program.workspace = true
themelios-syntax.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["resource"] }

[dev-dependencies]
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
proptest = "1.11"
syn = "=2.0.119"

[lints]
workspace = true

[[bin]]
name = "zetesis-validate"
path = "src/main.rs"

[[example]]
name = "book-workload"
path = "../../docs/book/examples/workload.rs"
test = true

[[example]]
name = "release_observations"
test = true
