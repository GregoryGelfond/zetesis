[package]
name = "zetesis-wgpu"
version.workspace = true
description = "An exact, explicitly static batched reduct oracle on wgpu compute devices."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
zetesis-backend.workspace = true
zetesis-core.workspace = true
zetesis-cpu.workspace = true
zetesis-ferraris.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
pollster.workspace = true

# zetesis targets Metal on Apple platforms and Vulkan on every other platform;
# no other graphics API is compiled.
[target.'cfg(target_vendor = "apple")'.dependencies]
wgpu = { workspace = true, features = ["metal"] }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
wgpu = { workspace = true, features = ["vulkan"] }

[dev-dependencies]
# The shader validator paired with this wgpu release. Hardware-independent
# validation checks the authored WGSL even when no adapter is available.
naga = { version = "=30.0.1", features = ["wgsl-in"] }
zetesis-test-support.workspace = true
zetesis-theory-support.workspace = true

[lints]
workspace = true
