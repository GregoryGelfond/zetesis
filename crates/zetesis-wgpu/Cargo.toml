[package]
name = "zetesis-wgpu"
version.workspace = true
description = "An exact, explicitly static batched reduct oracle on wgpu compute devices."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
zetesis-backend = { path = "../zetesis-backend" }
zetesis-core = { path = "../zetesis-core" }
zetesis-cpu = { path = "../zetesis-cpu" }
zetesis-ferraris = { path = "../zetesis-ferraris" }
wgpu.workspace = true
bytemuck.workspace = true
pollster.workspace = true

[dev-dependencies]
# The shader validator paired with this wgpu release. Hardware-independent
# validation checks the authored WGSL even when no adapter is available.
naga = { version = "=30.0.1", features = ["wgsl-in"] }

[lints]
workspace = true
