name = "zetesis_evaluation_refinement"
version = "0.0.0"
defaultTargets = ["ProgressExample", "TheorySatisfaction", "FixedLoopExample", "RootScanExample", "FrozenQueryExample", "SelectedAtoms", "ScalarSubsetsExample", "SubsetSteps", "SubsetQuery", "OwnedMembership", "MembershipVerdicts", "RuntimeEffects"]

[leanOptions]
autoImplicit = false
warningAsError = true

[[require]]
name = "aeneas"
path = ".lake/aeneas/backends/lean"

[[lean_lib]]
name = "PureExternals"

[[lean_lib]]
name = "AtomicTypes"

[[lean_lib]]
name = "AtomicLoad"

[[lean_lib]]
name = "Evaluator"

[[lean_lib]]
name = "Mask"

[[lean_lib]]
name = "Membership"

[[lean_lib]]
name = "Iteration"

[[lean_lib]]
name = "Control"

[[lean_lib]]
name = "Step"

[[lean_lib]]
name = "Progress"

[[lean_lib]]
name = "ProgressExample"

[[lean_lib]]
name = "Zetesis"
srcDir = "../../proofs"
# Explicit dependency closure: build these shared sources on the extraction toolchain.
globs = [
  "Zetesis.Core",
  "Zetesis.Ferraris",
  "Zetesis.FerrarisMask",
  "Zetesis.DagSharing",
  "Zetesis.FerrarisGuards",
  "Zetesis.RuleFactorization",
  "Zetesis.TightPlans",
  "Zetesis.BatchAccounting",
  "Zetesis.CertifiedExecution",
  "Zetesis.TightEvaluation",
  "Zetesis.ReductEvaluation",
  "Zetesis.FiniteMembership",
  "Zetesis.SubsetCounter",
  "Zetesis.PackedInterpretations",
  "Zetesis.PackedSubsets",
]

